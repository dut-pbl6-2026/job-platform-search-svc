name: ci
on: { push: { branches: [main] }, pull_request: { branches: [main] } }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.100' }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore SearchService.sln
      - name: Format check
        run: dotnet format SearchService.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build SearchService.sln --warnaserror --no-restore
      - name: Test
        run: dotnet test SearchService.sln --no-build --no-restore
